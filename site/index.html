<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Poppy’s Screening Notes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="header">
    <div class="container brand">
      <h1>Poppy’s Screening Notes</h1>
      <nav class="nav">
        <a href="#films">Films</a>
        <a href="#books">Books</a>
        <a href="travel.html">Travel</a>
        <a href="photography.html">Photography</a>
        <a href="outdoor.html">Outdoor</a>
      </nav>
    </div>
  </header>

  <section class="hero">
    <div class="container hero-card">
      <div class="hero-text">
        <h2 class="hero-title" id="hero-title"></h2>
        <div class="hero-subtitle" id="hero-subtitle"></div>
        <div class="hero-portrait">
          <img src="assets/hero.JPG" alt="Poppy portrait" />
        </div>
        <div id="intro"></div>
        <div class="identity" id="identity"></div>
      </div>
    </div>
  </section>

  <section class="section" id="films">
    <div class="container">
      <h2>🎬 Films</h2>
      <p id="films-desc"></p>
      <div class="grid" id="films-grid"></div>
    </div>
  </section>

  <section class="section" id="books">
    <div class="container">
      <h2>📚 Books</h2>
      <p id="books-desc"></p>
      <div class="grid" id="books-grid"></div>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <h2>🌍 Travel</h2>
      <p id="travel-desc"></p>
      <div class="gallery-grid" id="travel-grid"></div>
      <div style="margin-top:12px"><a class="button" href="travel.html">View Travel →</a></div>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <h2>📷 Photography</h2>
      <p id="photo-desc"></p>
      <div class="gallery-grid" id="photo-grid"></div>
      <div style="margin-top:12px"><a class="button" href="photography.html">View Photography →</a></div>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <h2>🥾 Outdoor</h2>
      <p id="outdoor-desc"></p>
      <div class="gallery-grid" id="outdoor-grid"></div>
      <div style="margin-top:12px"><a class="button" href="outdoor.html">View Outdoor →</a></div>
    </div>
  </section>

  <footer class="footer">
    © Poppy’s Little World
  </footer>

  <script src="app.js"></script>
</body>
</html>
